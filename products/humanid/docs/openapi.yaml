  # --- DEVELOPER (9 endpoints) ---
  /developer/keys:
    post:
      tags: [Developers]
      summary: Create an API key
      operationId: developerCreateKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "Production Key"
                environment:
                  type: string
                  enum: [SANDBOX, PRODUCTION]
                permissions:
                  type: object
                  properties:
                    read:
                      type: boolean
                      default: true
                    write:
                      type: boolean
                      default: true
      responses:
        '201':
          description: API key created (full key returned only once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                    description: "Full API key (only returned on creation, never again)"
                    example: "humanid_sk_test_abc123..."
                  keyPrefix:
                    type: string
                    example: "humanid_sk_"
                  name:
                    type: string
                  environment:
                    type: string
                    enum: [SANDBOX, PRODUCTION]
                  status:
                    type: string
                    enum: [ACTIVE, REVOKED]
                  permissions:
                    type: object
                    properties:
                      read:
                        type: boolean
                      write:
                        type: boolean
                  rateLimit:
                    type: integer
                    example: 1000
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Developers]
      summary: List API keys
      operationId: developerListKeys
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of API keys (key hash never returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        keyPrefix:
                          type: string
                        name:
                          type: string
                        environment:
                          type: string
                          enum: [SANDBOX, PRODUCTION]
                        status:
                          type: string
                          enum: [ACTIVE, REVOKED]
                        permissions:
                          type: object
                        rateLimit:
                          type: integer
                        lastUsedAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/keys/{id}/rotate:
    post:
      tags: [Developers]
      summary: Rotate an API key
      operationId: developerRotateKey
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key rotated; old key revoked, new key returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                    description: "New full API key (only returned once)"
                  keyPrefix:
                    type: string
                  name:
                    type: string
                  environment:
                    type: string
                    enum: [SANDBOX, PRODUCTION]
                  status:
                    type: string
                    enum: [ACTIVE]
                  message:
                    type: string
                    example: "Key rotated. Old key has been revoked."
        '400':
          description: Cannot rotate a revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/keys/{id}:
    delete:
      tags: [Developers]
      summary: Revoke an API key
      operationId: developerRevokeKey
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [REVOKED]
                  message:
                    type: string
                    example: "API key revoked"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/keys/usage:
    get:
      tags: [Developers]
      summary: Get API key usage statistics
      operationId: developerGetKeyUsage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregate key usage stats for the authenticated developer
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalKeys:
                    type: integer
                    example: 5
                  activeKeys:
                    type: integer
                    example: 3
                  revokedKeys:
                    type: integer
                    example: 2
                  totalRequests:
                    type: integer
                    example: 4523
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/sandbox/seed:
    post:
      tags: [Developers]
      summary: Seed sandbox with test data
      operationId: developerSeedSandbox
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Sandbox seeded with test DIDs and credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sandbox environment seeded with test data"
                  testDids:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        did:
                          type: string
                          example: "did:humanid:z6Mkf5rGMoatrSj1f37..."
                  testCredentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          example: "UniversityDegree"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/sandbox/status:
    get:
      tags: [Developers]
      summary: Get sandbox environment status
      operationId: developerGetSandboxStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current sandbox resource counts and feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  environment:
                    type: string
                    example: "SANDBOX"
                  didCount:
                    type: integer
                  credentialCount:
                    type: integer
                  apiKeyCount:
                    type: integer
                  features:
                    type: object
                    properties:
                      unlimitedRateLimit:
                        type: boolean
                      testCredentials:
                        type: boolean
                      noBlockchainAnchoring:
                        type: boolean
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/rotate-encryption-key:
    post:
      tags: [Developers]
      summary: Re-encrypt all data with a new encryption key (admin only)
      operationId: developerRotateEncryptionKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldKeyHex, newKeyHex]
              properties:
                oldKeyHex:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: "Current 32-byte hex-encoded encryption key"
                newKeyHex:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: "New 32-byte hex-encoded encryption key"
      responses:
        '200':
          description: All encrypted data re-encrypted with the new key
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Encryption key rotation complete. Update CLAIMS_ENCRYPTION_KEY env var to the new key."
                  credentialsMigrated:
                    type: integer
                  didsMigrated:
                    type: integer
                  webhooksMigrated:
                    type: integer
                  skipped:
                    type: integer
        '400':
          description: Old key mismatch or re-encryption failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /developer/logs:
    get:
      tags: [Developers]
      summary: Get request log history
      operationId: developerGetLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          description: Filter by audit action
          schema:
            type: string
      responses:
        '200':
          description: Paginated request log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        action:
                          type: string
                        entityType:
                          type: string
                        entityId:
                          type: string
                        metadata:
                          type: object
                        ipAddress:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- AUDIT (3 endpoints) ---
  /audit/events:
    get:
      tags: [Audit]
      summary: Query audit events
      operationId: auditListEvents
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Start of date range (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of date range (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated tamper-evident audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        action:
                          type: string
                        entityType:
                          type: string
                        entityId:
                          type: string
                        metadata:
                          type: object
                        ipAddress:
                          type: string
                        userAgent:
                          type: string
                        prevHash:
                          type: string
                          description: "SHA-256 hash of previous entry (tamper-evident chain)"
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audit/events/export:
    get:
      tags: [Audit]
      summary: Export audit events as CSV or JSON
      operationId: auditExportEvents
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [csv, json]
            default: json
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Exported audit events (CSV attachment or JSON body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  total:
                    type: integer
                  exportedAt:
                    type: string
                    format: date-time
            text/csv:
              schema:
                type: string
                description: "CSV file with columns: id, userId, action, entityType, entityId, ipAddress, userAgent, createdAt"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audit/events/verify:
    get:
      tags: [Audit]
      summary: Verify audit chain integrity
      operationId: auditVerifyChain
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Hash-chain integrity verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact:
                    type: boolean
                    description: "true if all prevHash links are valid"
                    example: true
                  entriesChecked:
                    type: integer
                  totalEntries:
                    type: integer
                  brokenAt:
                    type: string
                    format: uuid
                    nullable: true
                    description: "ID of the first entry with a broken hash (null if intact)"
                  verifiedAt:
                    type: string
                    format: date-time
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- SSO (4 endpoints) ---
  /sso/oidc:
    post:
      tags: [SSO]
      summary: Configure OIDC provider for an organization
      operationId: ssoConfigureOidc
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, discoveryUrl, clientId, clientSecret]
              properties:
                orgId:
                  type: string
                  format: uuid
                discoveryUrl:
                  type: string
                  format: uri
                  example: "https://accounts.google.com/.well-known/openid-configuration"
                clientId:
                  type: string
                  minLength: 1
                clientSecret:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: OIDC provider configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    example: "oidc"
                  orgId:
                    type: string
                    format: uuid
                  discoveryUrl:
                    type: string
                    format: uri
                  clientId:
                    type: string
                  configuredAt:
                    type: string
                    format: date-time
        '400':
          description: Validation error or SSRF-blocked URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the organization owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [SSO]
      summary: Remove OIDC configuration
      operationId: ssoRemoveOidc
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OIDC configuration removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OIDC configuration removed"
        '400':
          description: Missing orgId parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the organization owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sso/saml:
    post:
      tags: [SSO]
      summary: Configure SAML provider for an organization
      operationId: ssoConfigureSaml
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, metadataUrl, entityId]
              properties:
                orgId:
                  type: string
                  format: uuid
                metadataUrl:
                  type: string
                  format: uri
                  example: "https://idp.example.com/saml/metadata"
                entityId:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: SAML provider configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    example: "saml"
                  orgId:
                    type: string
                    format: uuid
                  metadataUrl:
                    type: string
                    format: uri
                  entityId:
                    type: string
                  configuredAt:
                    type: string
                    format: date-time
        '400':
          description: Validation error or SSRF-blocked URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the organization owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sso/providers:
    get:
      tags: [SSO]
      summary: List SSO providers for an organization
      operationId: ssoListProviders
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSO providers configured for the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId:
                    type: string
                    format: uuid
                  orgName:
                    type: string
                  ssoEnforced:
                    type: boolean
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [oidc, saml]
                        configuredAt:
                          type: string
                          format: date-time
        '400':
          description: Missing orgId parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --- WEBAUTHN (6 endpoints) ---
  /webauthn/register/options:
    post:
      tags: [WebAuthn]
      summary: Generate passkey registration options
      operationId: webauthnRegisterOptions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [didId]
              properties:
                didId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: PublicKeyCredentialCreationOptions for the browser WebAuthn API
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    description: "Base64url-encoded challenge"
                  rp:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "HumanID"
                      id:
                        type: string
                        example: "localhost"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                        format: email
                      displayName:
                        type: string
                  pubKeyCredParams:
                    type: array
                    items:
                      type: object
                      properties:
                        alg:
                          type: integer
                        type:
                          type: string
                  timeout:
                    type: integer
                    example: 60000
                  attestation:
                    type: string
                    example: "direct"
                  authenticatorSelection:
                    type: object
                    properties:
                      authenticatorAttachment:
                        type: string
                      requireResidentKey:
                        type: boolean
                      userVerification:
                        type: string
                  excludeCredentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: DID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webauthn/register/verify:
    post:
      tags: [WebAuthn]
      summary: Verify passkey registration attestation
      operationId: webauthnRegisterVerify
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [didId, credential]
              properties:
                didId:
                  type: string
                  format: uuid
                credential:
                  type: object
                  required: [id, rawId, type, response]
                  properties:
                    id:
                      type: string
                    rawId:
                      type: string
                    type:
                      type: string
                      enum: [public-key]
                    response:
                      type: object
                      required: [clientDataJSON, attestationObject]
                      properties:
                        clientDataJSON:
                          type: string
                          description: "Base64url-encoded client data"
                        attestationObject:
                          type: string
                          description: "Base64url-encoded CBOR attestation"
      responses:
        '201':
          description: Passkey registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  credentialId:
                    type: string
                  message:
                    type: string
                    example: "Passkey registered successfully"
        '400':
          description: Invalid attestation, challenge mismatch, or origin mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: DID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webauthn/authenticate/options:
    post:
      tags: [WebAuthn]
      summary: Generate passkey authentication options
      operationId: webauthnAuthenticateOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions for the browser WebAuthn API
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    description: "Base64url-encoded challenge"
                  timeout:
                    type: integer
                    example: 60000
                  rpId:
                    type: string
                    example: "localhost"
                  allowCredentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                  userVerification:
                    type: string
                    example: "preferred"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webauthn/authenticate/verify:
    post:
      tags: [WebAuthn]
      summary: Verify passkey authentication assertion
      operationId: webauthnAuthenticateVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, credential]
              properties:
                userId:
                  type: string
                  format: uuid
                credential:
                  type: object
                  required: [id, rawId, type, response]
                  properties:
                    id:
                      type: string
                    rawId:
                      type: string
                    type:
                      type: string
                      enum: [public-key]
                    response:
                      type: object
                      required: [clientDataJSON, authenticatorData, signature]
                      properties:
                        clientDataJSON:
                          type: string
                          description: "Base64url-encoded client data"
                        authenticatorData:
                          type: string
                          description: "Base64url-encoded authenticator data"
                        signature:
                          type: string
                          description: "Base64url-encoded signature"
      responses:
        '200':
          description: Authentication successful; JWT tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  role:
                    type: string
                    enum: [holder, issuer, developer, admin]
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '400':
          description: Invalid assertion, challenge expired, or origin mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Passkey not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account suspended or deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webauthn/credentials:
    get:
      tags: [WebAuthn]
      summary: List registered passkeys
      operationId: webauthnListCredentials
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of registered passkeys
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        credentialId:
                          type: string
                        did:
                          type: string
                          example: "did:humanid:z6Mkf5rGMoatrSj1f37..."
                        createdAt:
                          type: string
                          format: date-time
                        metadata:
                          type: object
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webauthn/credentials/{id}:
    delete:
      tags: [WebAuthn]
      summary: Remove a registered passkey
      operationId: webauthnDeleteCredential
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Passkey removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Passkey removed successfully"
        '401':
          description: Not authenticated
          content:
