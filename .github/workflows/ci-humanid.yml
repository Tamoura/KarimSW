name: HumanID CI

on:
  pull_request:
    paths:
      - 'products/humanid/**'
  push:
    branches: [main]
    paths:
      - 'products/humanid/**'

jobs:
  test:
    name: Test HumanID API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: humanid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/humanid_test
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CLAIMS_ENCRYPTION_KEY: ${{ secrets.CI_CLAIMS_ENCRYPTION_KEY }}
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: ${{ secrets.CI_INTERNAL_API_KEY }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: products/humanid/apps/api/package-lock.json

      - name: Install dependencies
        working-directory: products/humanid/apps/api
        run: npm ci

      - name: Audit dependencies
        working-directory: products/humanid/apps/api
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        working-directory: products/humanid/apps/api
        run: npx prisma generate

      - name: Type check
        working-directory: products/humanid/apps/api
        run: npx tsc --noEmit

      - name: Run database migrations
        working-directory: products/humanid/apps/api
        run: npx prisma db push --skip-generate

      - name: Run tests with coverage
        working-directory: products/humanid/apps/api
        run: npx jest --coverage --forceExit

      - name: Check coverage thresholds
        working-directory: products/humanid/apps/api
        run: |
          LINES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)")
          BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)")
          echo "Lines: $LINES%, Branches: $BRANCHES%"
          node -e "const c=require('./coverage/coverage-summary.json'); if(c.total.lines.pct<85){console.error('Line coverage below 85%');process.exit(1)}"
          node -e "const c=require('./coverage/coverage-summary.json'); if(c.total.branches.pct<80){console.error('Branch coverage below 80%');process.exit(1)}"
