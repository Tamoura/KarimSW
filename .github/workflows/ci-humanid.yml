name: HumanID CI

on:
  pull_request:
    paths:
      - 'products/humanid/**'
  push:
    branches: [main]
    paths:
      - 'products/humanid/**'

jobs:
  test:
    name: Test HumanID API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: humanid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/humanid_test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters-long
      CLAIMS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: ci-test-internal-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: products/humanid/apps/api/package-lock.json

      - name: Install dependencies
        working-directory: products/humanid/apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: products/humanid/apps/api
        run: npx prisma generate

      - name: Run database migrations
        working-directory: products/humanid/apps/api
        run: npx prisma db push --skip-generate

      - name: Run tests with coverage
        working-directory: products/humanid/apps/api
        run: npx jest --coverage --forceExit

      - name: Check coverage thresholds
        working-directory: products/humanid/apps/api
        run: |
          LINES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)")
          BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)")
          echo "Lines: $LINES%, Branches: $BRANCHES%"
          node -e "const c=require('./coverage/coverage-summary.json'); if(c.total.lines.pct<75){process.exit(1)}"
