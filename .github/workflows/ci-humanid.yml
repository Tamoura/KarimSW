name: HumanID CI

on:
  pull_request:
    paths:
      - 'products/humanid/**'
  push:
    branches: [main]
    paths:
      - 'products/humanid/**'

jobs:
  test:
    name: Test HumanID API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: humanid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/humanid_test
      # Test-only secrets — safe to hardcode; never used outside CI test runs.
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-jwt-secret-minimum-32-chars!!' }}
      CLAIMS_ENCRYPTION_KEY: ${{ secrets.CI_CLAIMS_ENCRYPTION_KEY || 'ci-test-enc-key-exactly-32-chars!' }}
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: ${{ secrets.CI_INTERNAL_API_KEY || 'ci-test-internal-api-key' }}
      METRICS_API_KEY: ci-test-metrics-api-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: products/humanid/apps/api/package-lock.json

      - name: Install dependencies
        working-directory: products/humanid/apps/api
        run: npm ci

      - name: Audit production dependencies
        working-directory: products/humanid/apps/api
        run: |
          # Audit production deps only at high/critical level.
          # Dev dep vulns (jest/minimatch chain) have no non-breaking fix and
          # are excluded — they cannot be exploited in production.
          npm audit --omit=dev --audit-level=high

      - name: Report all vulnerability summary
        working-directory: products/humanid/apps/api
        continue-on-error: true
        run: |
          echo "--- Full audit summary (informational) ---"
          npm audit --audit-level=moderate || true

      - name: Generate Prisma client
        working-directory: products/humanid/apps/api
        run: npx prisma generate

      - name: Type check
        working-directory: products/humanid/apps/api
        run: npx tsc --noEmit

      - name: Run database migrations
        working-directory: products/humanid/apps/api
        run: npx prisma db push --skip-generate

      - name: Run tests with coverage
        working-directory: products/humanid/apps/api
        run: npx jest --coverage --forceExit

      - name: Check coverage thresholds
        working-directory: products/humanid/apps/api
        run: |
          LINES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)")
          BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)")
          echo "Lines: $LINES%, Branches: $BRANCHES%"
          node -e "const c=require('./coverage/coverage-summary.json'); if(c.total.lines.pct<85){console.error('Line coverage below 85%');process.exit(1)}"
          node -e "const c=require('./coverage/coverage-summary.json'); if(c.total.branches.pct<80){console.error('Branch coverage below 80%');process.exit(1)}"

  test-web:
    name: Test HumanID Frontend (RTL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: products/humanid/apps/web/package-lock.json

      - name: Install dependencies
        working-directory: products/humanid/apps/web
        run: npm ci

      - name: Run frontend tests
        working-directory: products/humanid/apps/web
        run: npm test -- --ci --forceExit

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: humanid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: products/humanid/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: products/humanid/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: products/humanid/e2e
        run: npx playwright install chromium --with-deps

      - name: Install API dependencies
        working-directory: products/humanid/apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: products/humanid/apps/api
        run: npx prisma generate

      - name: Run database migrations
        working-directory: products/humanid/apps/api
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/humanid_test

      - name: Install Web dependencies
        working-directory: products/humanid/apps/web
        run: npm ci

      - name: Run E2E tests
        working-directory: products/humanid/e2e
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/humanid_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-jwt-secret-minimum-32-chars!!' }}
          # CLAIMS_ENCRYPTION_KEY requires exactly 64 hex characters (32 bytes for AES-256).
          # The unit-test job uses a short ASCII key because Jest bypasses index.ts startup
          # validation.  The E2E webServer runs index.ts directly, so the key must be valid.
          # CI_CLAIMS_ENCRYPTION_KEY secret contains a valid 64-hex-char test-only key.
          CLAIMS_ENCRYPTION_KEY: ${{ secrets.CI_CLAIMS_ENCRYPTION_KEY }}
          INTERNAL_API_KEY: ${{ secrets.CI_INTERNAL_API_KEY || 'ci-test-internal-api-key' }}
          METRICS_API_KEY: ci-test-metrics-api-key

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: products/humanid/e2e/playwright-report/

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
